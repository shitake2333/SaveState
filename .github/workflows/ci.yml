name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Restore
        run: dotnet restore SaveState.sln

      - name: Build
        run: dotnet build SaveState.sln -c Release --no-restore

      - name: Test
        run: dotnet test SaveState.sln -c Release --no-build --nologo

      - name: Pack
        run: dotnet pack SaveState.sln -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
